name: Check, build and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kaifan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: digital_ordering_system_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/digital_ordering_system_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci-test-only
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: '6379'
      SPRING_DATA_REDIS_PASSWORD: ''
      SPRING_DATA_REDIS_DATABASE: '1'
      MYBATIS_PLUS_CONFIGURATION_LOG_IMPL: org.apache.ibatis.logging.nologging.NoLoggingImpl
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
      VITE_SUPPORT_PHONE: ${{ github.ref == 'refs/heads/main' && vars.SUPPORT_PHONE || '' }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: diancan-admin/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
      - name: Scan public source for credentials
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact
      - name: Backend tests and package
        run: mvn -B -ntp -f diancan-admin/pom.xml verify
      - name: Frontend dependencies
        run: pnpm --dir diancan-admin-web install --frozen-lockfile
      - name: Merchant type check
        run: pnpm --dir diancan-admin-web typecheck
      - name: Viewport and kitchen notice checks
        run: node --test diancan-customer-web/tests/*.test.mjs diancan-admin-web/tests/*.test.mjs
      - name: Build release archive
        run: scripts/build-release.sh "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kaifan-release-${{ github.sha }}
          path: kaifan-release.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: diancan-admin/target/surefire-reports/
          retention-days: 3
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kaifan-release-${{ github.sha }}
      - name: Publish verified release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p "$RUNNER_TEMP/kaifan-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/kaifan-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/kaifan-ssh/known_hosts"
          trap 'rm -f "$RUNNER_TEMP/kaifan-ssh/key"' EXIT
          archive_sha=$(sha256sum kaifan-release.tar.gz | cut -d' ' -f1)
          ssh -T -i "$RUNNER_TEMP/kaifan-ssh/key" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/kaifan-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "release $GITHUB_SHA $archive_sha" < kaifan-publish.tar.gz
