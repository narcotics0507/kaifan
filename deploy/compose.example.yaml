name: kaifan
x-log: &log
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  mysql:
    image: mysql@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - 127.0.0.1:33306:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Private env required}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: kaifan
      MYSQL_USER: kaifan
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Private env required}
      TZ: Asia/Shanghai
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --innodb-buffer-pool-size=128M, --max-connections=40, --performance-schema=OFF]
    volumes:
      - /apps/kaifan/data/mysql:/var/lib/mysql
      - /apps/kaifan/config/bootstrap.sql:/docker-entrypoint-initdb.d/10-kaifan.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -u "$${MYSQL_USER}" -D kaifan -Nse "SELECT 1 FROM sys_user LIMIT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30
    logging: *log
  redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    mem_limit: 96m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Private env required}
    command: [sh, -c, 'exec redis-server --appendonly yes --maxmemory 48mb --maxmemory-policy noeviction --requirepass "$${REDIS_PASSWORD}"']
    volumes:
      - /apps/kaifan/data/redis:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *log
  images:
    image: kaifan/minio:2025-10-15-amd64
    restart: unless-stopped
    mem_limit: 256m
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Private env required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Private env required}
    volumes:
      - /apps/kaifan/data/images:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 3s
      retries: 24
    logging: *log
  backend:
    image: eclipse-temurin@sha256:8993f1aed8b25fcea7a7047a7949c1866fa558fc6830d938c22c4f13b26be9d7
    restart: unless-stopped
    mem_limit: 640m
    env_file:
      - /apps/kaifan/config/private.env
      - /apps/kaifan/config/wechat.env
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=48m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:+ExitOnOutOfMemoryError
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/application.yml
      TZ: Asia/Shanghai
    command: [java, -jar, /app/backend.jar]
    volumes:
      - /apps/kaifan/current/backend.jar:/app/backend.jar:ro
      - /apps/kaifan/config:/app/config:ro
      - /apps/kaifan/logs/backend:/logs
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      images: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8080/api/app/dish/category/list | grep -q ''"code":200''']
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12
    logging: *log
  web:
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - 0.0.0.0:18080:80
    volumes:
      - /apps/kaifan/current/web:/usr/share/nginx/html:ro
      - /apps/kaifan/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: {condition: service_healthy}
    logging: *log
