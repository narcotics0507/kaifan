server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    # Avoid logging private signed object queries or authentication bodies.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { access_log off; return 200 'ok\n'; }
    location = /api/auth/register { return 403; }
    location ~ ^/api/(doc\.html|swagger|v3/api-docs|webjars) { return 404; }
    location /api/ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 75s;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Read-only private object access; signatures are validated by MinIO.
    location /dish-images/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://images:9000;
        proxy_set_header Host $http_host;
    }
    location = /order { return 302 /order/$is_args$args; }
    # Merchant routes share /order with the separate customer app.
    location = /order/list { try_files $uri /index.html; }
    location = /order/detail { try_files $uri /index.html; }
    location /order/ {
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-cache always;
        try_files $uri $uri/ /order/index.html;
    }
    location / {
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
