server:
  address: 0.0.0.0
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/kaifan?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: kaifan
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 0
  task:
    scheduling:
      pool:
        size: 2
coupon:
  grant:
    mq:
      enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
storage:
  minio:
    enabled: true
    endpoint: http://images:9000
    public-url: ${PUBLIC_ORIGIN:http://127.0.0.1:18080}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: dish-images
    private-bucket: true
    auto-create-bucket: true
wechat:
  miniapp:
    phone-login-enabled: false
wx:
  pay:
    enabled: false
restaurant:
  h5:
    enabled: true
    signing-key: ${RESTAURANT_H5_SIGNING_KEY}
    public-origin: ${PUBLIC_ORIGIN}
  auth:
    allow-local-fixture-login: false
  features:
    coupons: false
    membership: false
    online-payment: false
    auto-clear-table: true
    rush: false
    specs: false
    banners: false
    reviews: false
    feedback: false
logging:
  config: file:/app/config/logback.xml
  level:
    com.scaffold: info
